<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="TeachHub - Your Saved Learning Resources">

  <meta
    name="keywords"
    content="TeachHub, Watchlist, Saved Tutorials, GitHub, Learning">

  <meta
    name="author"
    content="Kevin Cross Minchakpu">

  <title>TeachHub | My Watchlist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="./src/css/style.css">

  <script
    type="module"
    src="./src/js/pages/saved.js"
    defer>
  </script>

</head>

<body>

<header class="site-header">

  <a href="/index.html" class="logo-container">

    <img
      src="/images/logo.webp"
      alt="TeachHub Logo"
      class="site-logo"
      width="70"
      height="70">

    <h1>
      Teach<span>Hub</span>
    </h1>

  </a>

  <div class="controls">

    <span
      id="welcomeUser"
      class="welcome-user">
    </span>

    <a
      href="/index.html"
      class="btn-accent">

      Home

    </a>

    <span class="watchlist-counter">

      Saved:
      <strong id="savedCount">
        0
      </strong>

    </span>

    <button
      id="clearWatchlistBtn"
      class="btn-danger"
      type="button">

      Clear Watchlist

    </button>

    <button
      id="logoutBtn"
      class="btn-accent"
      type="button">

      Logout

    </button>

  </div>

</header>

<main class="main-content">

  <section class="resource-section">

    <div class="section-header">

      <div>

        <h2>

          My Watchlist

        </h2>

        <p
          id="savedSummary"
          class="saved-summary">

          0 resources saved

        </p>

      </div>

    </div>

    <div
      id="savedContainer"
      class="card-grid">

    </div>

  </section>

</main>

<!-- Video Modal -->

<div
  id="videoModal"
  class="modal hidden"
  aria-hidden="true">

  <div class="modal-content">
    <button
      id="closeModalBtn"
      class="close-btn"
      type="button">
      &times;
    </button>
    <div id="modalPlayerContainer"></div>
  </div>
</div>

<!-- Confirmation Modal -->
<div
  id="confirmModal"
  class="confirm-overlay hidden">
  <div class="confirm-box">
    <h3
      id="confirmTitle"
      class="confirm-title">
      Confirm
    </h3>
    <p
      id="confirmMessage"
      class="confirm-message">
    </p>

    <div class="confirm-actions">
      <button
        id="confirmNo"
        type="button"
        class="btn-secondary">
        Cancel
      </button>

      <button
        id="confirmYes"
        type="button"
        class="btn-github">
        Confirm
      </button>
    </div>
  </div>

</div>
<footer class="site-footer">

  <p>

    &copy; 2026 TeachHub |
    Kevin Cross Minchakpu |
    Built with HTML, CSS & JavaScript

  </p>

</footer>

</body>
</html>
