<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TeachHub - Centralized Learning Resources for Developers" />
  <meta name="keywords" content="TeachHub, Developer Resources, YouTube Tutorials, GitHub Repositories, Learning Hub" />
  <meta name="author" content="Kevin Cross Minchakpu" />
  <title>TeachHub | Developer Resource Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/style.css" />
  <script type="module" src="/src/js/main.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="site-header">
  <a href="index.html" class="logo-container">
  <!-- Image Logo -->
  <img 
    src="/images/logo.svg" 
    alt="TeachHub Logo" 
    class="site-logo" 
    width="70" 
    height="70" 
  />
  <h1>Teach<span>Hub</span></h1>
</a>
  
  <div class="search-bar-container">
    <input type="text" id="searchInput" placeholder="Search topics (e.g., Async JS, CSS Grid)..." />
    <button type="button" id="searchBtn" aria-label="Search">Search</button>
  </div>
  <div class="user-menu">
  <span id="welcomeUser"></span>
  <a href="/saved.html" class="btn-accent">
    Watchlist (<span id="savedCount">0</span>)
  </a>

  <button type="button" id="logoutBtn" class="btn-accent">
    Logout
  </button>

</div>

</header>

<!-- Technology Filters -->
<section class="technology-section">
  <div class="technology-filters">
    <button type="button" class="tech-filter-btn active" data-tech="All">All</button>
    <button type="button" class="tech-filter-btn" data-tech="HTML">HTML</button>
    <button type="button" class="tech-filter-btn" data-tech="CSS">CSS</button>
    <button type="button" class="tech-filter-btn" data-tech="JavaScript">JavaScript</button>
    <button type="button" class="tech-filter-btn" data-tech="SQL">SQL</button>
  </div>
</section>

 <!-- Hero / Featured Topics Section -->
<section class="hero-banner">
  <h2>Featured Topics</h2>
    <div id="featuredContainer" class="featured-grid">
    <!-- Dynamic topic cards will be rendered here via JS -->
  </div>
</section>

  <!-- Main Content Grid -->
  <main class="main-content">
    <!-- YouTube Section -->
    <section class="resource-section">
      <h2>YouTube Tutorials</h2>
      <div id="youtubeContainer" class="card-grid">
        <!-- Dynamic video cards render here -->
      </div>
    </section>

    <!-- GitHub Section -->
    <section class="resource-section">
      <h2>GitHub Repositories</h2>
      <div id="githubContainer" class="card-grid">
        <!-- Dynamic repo cards render here -->
      </div>
    </section>
  </main>

  <!-- Video Modal Overlay -->
  <div id="videoModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content">
      <button type="button" id="closeModalBtn" class="close-btn">&times;</button>
      <div id="modalPlayerContainer"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>&copy; 2026 TeachHub | Kevin Cross Minchakpu | Built with Vanilla JS & Web Standards</p>
  </footer>

  
</body>
</html>
